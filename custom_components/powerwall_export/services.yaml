check_setup:
  name: Check setup (read only)
  description: Read settings, tariff and live status without changing the Powerwall. Does not prove write permission.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: powerwall_export
start_export:
  name: Start timed export
  description: Save current settings, apply a temporary export tariff and restore afterwards. This requests optimiser-driven export, not a guaranteed power level.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: powerwall_export
    duration_minutes:
      default: 30
      selector:
        number:
          min: 5
          max: 360
          step: 1
          unit_of_measurement: min
          mode: box
    reserve_percent:
      description: Leave disabled/omitted to keep the existing reserve. An explicit value is temporary and restored afterwards.
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: '%'
          mode: box
    end_time:
      description: Optional ISO timestamp with UTC offset or Z, normally supplied by the Octopus blueprint. Overrides duration. Rounded down to the minute.
      selector:
        text:
stop_export:
  name: Stop and restore
  description: Restore the saved tariff and changed settings, and verify them. A failed restore retains the snapshot and retries automatically.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: powerwall_export

prepare_session:
  name: Prepare future Saving Session (test)
  description: Preview by default. Optionally prepare a tariff within 60 minutes and block grid charging until the end, restoring its original setting after the tariff.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: powerwall_export
    start_time:
      required: true
      selector:
        text:
    end_time:
      required: true
      selector:
        text:
    dry_run:
      default: true
      selector:
        boolean:
    block_grid_charging:
      description: Optional. Block grid charging when preparing a session, then restore its previous setting after the session. Does not alter grid export permissions.
      default: false
      selector:
        boolean:
    minimum_end_charge:
      description: Minimum battery charge at session end, percent. Default 60.
      default: 60
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    charge_margin:
      description: Extra charge margin above the minimum; default 5 percent.
      default: 5
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: "%"
    enforce_reserve:
      description: Temporarily set Tesla backup reserve to the protected charge threshold, then restore the original reserve after the session. Default off.
      default: false
      selector:
        boolean:

get_tariff:
  name: Get current tariff (read only)
  description: Returns current Powerwall buy and sell tariff including raw weekday periods; does not write settings or expose tokens. Select Response in Developer Tools to copy.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: powerwall_export

reconcile_recovery:
  name: Diagnose pending recovery (read only)
  description: Compare live tariff and operating settings against the saved recovery snapshot. Makes no writes or changes.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: powerwall_export

confirm_recovery:
  name: Complete verified recovery (no tariff write)
  description: Clears pending recovery only if the live tariff and all saved operating settings match exactly. Makes no Powerwall changes.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: powerwall_export
